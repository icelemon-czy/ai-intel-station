[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-station"
version = "0.1.0"
description = "Unified operator surface for AI Intel Station"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
wechat = [
  "camoufox[geoip]",
  "markdownify",
  "beautifulsoup4",
  "httpx",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
research = "ai_intel_station.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_intel_station*"]

[tool.setuptools.package-data]
"ai_intel_station.discovery" = ["discovery.yaml.example", "schedule/*"]
"ai_intel_station.adapters.web" = [
  "static/index.html",
  "static/assets/*.css",
  "static/assets/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "e2e: live end-to-end tests that require external services or credentials",
  "wechat: tests that require the optional WeChat runtime",
]
