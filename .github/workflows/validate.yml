name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_remote_tests:
        description: "Trigger remote test execution"
        required: false
        default: "false"

jobs:
  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical project Skills are valid
        shell: bash
        run: |
          set -euo pipefail
          root=".agents/skills"
          test -d "$root"

          found=0
          for file in "$root"/*/SKILL.md; do
            test -e "$file" || continue
            found=1
            test "$(sed -n '1p' "$file")" = "---"
            close="$(awk 'NR>=2 && NR<=30 && /^---$/ {print NR; exit}' "$file")"
            test -n "$close"
            head -n "$close" "$file" | grep -q '^name:'
            head -n "$close" "$file" | grep -q '^description:'
            test "$(grep -c '^name:' "$file" || true)" -eq 1
            test "$(grep -c '^description:' "$file" || true)" -eq 1
          done
          test "$found" -eq 1

      - name: Agent adapters point to the canonical Skill
        run: |
          test ! -e .ai
          test ! -e .codex/legacy-skills
          grep -q '../../../.agents/skills/daily-discovery/SKILL.md' \
            .github/skills/daily-discovery/SKILL.md
          grep -q '../../../.agents/skills/daily-discovery/SKILL.md' \
            .claude/skills/daily-discovery/SKILL.md
          for root in .github/skills .claude/skills; do
            for directory in "$root"/*; do
              test "$(basename "$directory")" = daily-discovery
            done
          done

      - name: Active workflow docs do not reference the retired command
        shell: bash
        run: |
          set -euo pipefail
          leftover="$(
            grep -rn '/spec-fix' .agents/skills AGENTS.md CLAUDE.md README.md \
              | grep -v '原.*/spec-fix' || true
          )"
          if [ -n "$leftover" ]; then
            echo "$leftover"
            echo "Remove the retired /spec-fix command from active workflow docs."
            exit 1
          fi

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install lightweight core and dev test runtime
        run: uv sync --extra dev --frozen

      - name: Run broad core Python suite
        run: |
          uv run --frozen --extra dev python -m pytest -q tests \
            -m "not wechat" \
            --ignore=tests/test_discovery_runner.py \
            --ignore=tests/test_wechat_collect.py \
            --ignore=tests/test_wechat_e2e_live.py

      - name: Run discovery runner through its unittest adapter
        run: |
          uv run --frozen --extra dev python -m unittest \
            tests.test_discovery_runner -v

      - name: Build Python release artifacts
        run: |
          uv build
          uv run --frozen --extra dev python release/check_release_artifacts.py

      - name: Install and smoke-test the built wheel
        run: |
          uv venv --python 3.10 "$RUNNER_TEMP/ai-intel-wheel-smoke"
          uv pip install \
            --python "$RUNNER_TEMP/ai-intel-wheel-smoke/bin/python" \
            dist/*.whl
          "$RUNNER_TEMP/ai-intel-wheel-smoke/bin/research" --help
          "$RUNNER_TEMP/ai-intel-wheel-smoke/bin/python" \
            -I release/smoke_installed_wheel.py

  wechat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install optional WeChat and dev runtimes
        run: uv sync --extra dev --extra wechat --frozen

      - name: Run optional WeChat unit and runtime tests
        run: |
          uv run --frozen --extra dev --extra wechat python -m pytest -q \
            -m wechat tests/test_research_item.py tests/test_wechat_collect.py

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python backend runtime
        run: uv sync --frozen

      - name: Install, build, and test Web workspace
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  # Optional remote execution reference. It remains manual because the
  # repository does not own a self-hosted runner or SSH secret contract.
  remote-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_remote_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Report remote test configuration boundary
        run: |
          echo "Remote execution requires a project-owned runner or explicit SSH secrets."
          echo "No external machine is contacted by the default validation workflow."
